name: Android build

on:
  push:
    branches:
      - main
      - Develop
      - 'integration/**'
      - 'fix/**'
      - 'chore/**'
  pull_request:
    branches:
      - main
      - Develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble-debug:
    name: Unit tests and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          architecture: 'x64'

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify build environment
        run: |
          java -version
          python --version
          python3.10 --version

      - name: Install Android NDK and CMake when missing
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Android SDK: $SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          if [[ ! -d "$SDK_ROOT/ndk/27.0.12077973" || ! -d "$SDK_ROOT/cmake/3.22.1" ]]; then
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.0.12077973" "cmake;3.22.1"
          else
            echo "Required NDK and CMake versions are already installed."
          fi

      # llama.cpp + mtmd are compiled from source for both configured Android ABIs.
      # Preserve CMake/Ninja state and native object files across commits on this branch.
      - name: Restore native CMake build cache
        uses: actions/cache@v4
        with:
          path: |
            app/.cxx/
            app/build/intermediates/cxx/
          key: native-cxx-${{ runner.os }}-ndk27-cmake322-${{ hashFiles('app/src/main/cpp/**', 'app/build.gradle.kts') }}
          restore-keys: |
            native-cxx-${{ runner.os }}-ndk27-cmake322-

      - name: Restore Python package download cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: python-pip-${{ runner.os }}-3.10-${{ hashFiles('app/build.gradle.kts') }}
          restore-keys: |
            python-pip-${{ runner.os }}-3.10-

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Also persist Gradle's dependency and task-output cache on the long-lived
          # feature branch instead of making every feature-branch run read-only.
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/fix/cloud-vision-production-20261110' }}

      - name: Run unit tests and assemble debug APK
        run: bash ./gradlew --stacktrace --parallel --build-cache testDebugUnitTest assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: emre-gallery-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
